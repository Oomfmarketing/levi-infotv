plugins {
    id 'com.android.application'
}

// Signing: set KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (CI secrets)
// for a stable release key. Without them the build is signed with a debug key.
def ks = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.levitv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.levitv.app"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Control of the X-Requested-With header (YouTube refuses embeds it identifies as in-app)
    implementation 'androidx.webkit:webkit:1.12.1'
}

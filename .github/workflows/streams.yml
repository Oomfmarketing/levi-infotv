name: Camera stream check

on:
  schedule:
    - cron: '17 4 * * *'      # daily ~07:17 Finnish time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check every camera stream
        run: python3 scripts/check_streams.py

      - name: Save cam-status.json when something changed
        run: |
          # ignore the timestamp; commit only when a camera's state changes
          if git diff --quiet -I '"checked"' -- cam-status.json && git ls-files --error-unmatch cam-status.json >/dev/null 2>&1; then
            echo "No camera changes"; exit 0; fi
          git config user.name "LeviTV stream check"
          git config user.email "noreply@github.com"
          git add cam-status.json
          git commit -m "Camera status update"
          git push

      - name: Open / update / close the "camera offline" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Camera stream offline"
          N=$(cat .stream-offline-count)
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ "$N" -gt 0 ]; then
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file stream-report.md
            else gh label create camera --color d93f0b 2>/dev/null || true
                 gh issue create --title "$TITLE" --label camera --body-file stream-report.md; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All camera streams are live again."
          fi
          echo "### Camera check" >> "$GITHUB_STEP_SUMMARY"; cat stream-report.md >> "$GITHUB_STEP_SUMMARY"

name: Android TV app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional stable signing key (repo secrets). Without it the APK is debug-signed.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levitv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/levitv.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret — building with the debug key"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Collect APK and AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk levitv.apk
          cp android/app/build/outputs/bundle/release/app-release.aab levitv.aab

      - uses: actions/upload-artifact@v4
        with:
          name: levitv-apk
          path: levitv.apk

      # App bundle for Google Play: Actions run → Artifacts → levitv-aab
      - uses: actions/upload-artifact@v4
        with:
          name: levitv-aab
          path: levitv.aab

      - name: Publish release for levitv.com/app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: LeviTV for Android TV 1.0.${{ github.run_number }}
          body: |
            LeviTV for Android TV — your real-time view of Levi.
            Install on the TV with the Downloader app: levitv.com/app
          files: levitv.apk
          make_latest: true

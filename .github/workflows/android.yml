name: Android TV app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional stable signing key (repo secrets). Without it the APK is debug-signed.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levitv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/levitv.jks" >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release signed with the LeviTV upload key (repo secrets) — OK for Google Play"
          else
            echo "::warning title=Signing::No KEYSTORE_B64 secret — built with a throwaway debug key. Do NOT upload this AAB to Google Play."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log

      # Surface build errors as annotations (readable without the raw log)
      - name: Report build errors
        if: failure()
        run: |
          { grep -E "error:|^e: " build.log | head -10; sed -n '/What went wrong/,/^\* Try/p' build.log | head -40; } | grep -v "^\s*$" | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Collect APK and AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk levitv.apk
          cp android/app/build/outputs/bundle/release/app-release.aab levitv.aab

      - uses: actions/upload-artifact@v4
        with:
          name: levitv-apk
          path: levitv.apk

      # App bundle for Google Play: Actions run → Artifacts → levitv-aab
      - uses: actions/upload-artifact@v4
        with:
          name: levitv-aab
          path: levitv.aab

      - name: Publish release for levitv.com/app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: LeviTV for Android TV 1.0.${{ github.run_number }}
          body: |
            LeviTV for Android TV — your real-time view of Levi.
            Install on the TV with the Downloader app: levitv.com/app
            Google Play: upload levitv.aab (signed with the LeviTV upload key).
          files: |
            levitv.apk
            levitv.aab
          make_latest: true

      # Google Play internal testing — runs only when the PLAY_SERVICE_ACCOUNT_JSON secret exists
      # and the build is signed with the upload key. Release status comes from the repo variable
      # PLAY_RELEASE_STATUS ("draft" until the app has been reviewed once, then "completed").
      - name: Check Google Play upload
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ -n "$KEYSTORE_FILE" ]; then echo "go=1" >> "$GITHUB_OUTPUT";
          else echo "::notice title=Google Play::Upload skipped (no PLAY_SERVICE_ACCOUNT_JSON secret or unsigned build)"; fi

      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.go == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.levitv.app
          releaseFiles: levitv.aab
          releaseName: 1.0.${{ github.run_number }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
